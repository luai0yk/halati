name: status_saver
description: "A Status Saver."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.3
  shared_preferences: ^2.5.5
  phone_numbers_parser: ^9.0.24
  skeletonizer: ^2.1.0
  iconsax_flutter: 1.0.1

  # Media
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  photo_view: ^0.15.0
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1

  # Sharing & Utilities
  url_launcher: ^6.3.2
  share_plus: ^12.0.1

  flutter_localizations:
    sdk: flutter
  intl: any
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  video_player: ^2.11.1

  # App Startup
  flutter_native_splash: ^2.4.7
  package_info_plus: ^9.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
